name: Upsert Version

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Project slug'
        required: true
      version:
        description: 'Version string (e.g. v1.0.0)'
        required: true
      changelog:
        description: 'Changelog entries, one per line (required on create)'
        required: false
        default: ''
      asset_source:
        description: 'Source asset URL (required on create)'
        required: false
        default: ''
      asset_binary:
        description: 'Binary asset URL'
        required: false
        default: ''
      repo_tag_github:
        description: 'GitHub tag URL'
        required: false
        default: ''
      repo_tag_gitea:
        description: 'Gitea tag URL'
        required: false
        default: ''
      license:
        description: 'License identifier (defaults to MIT on create)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  upsert-version:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert Version
        uses: ddproxy/registry-actions/actions/upsert-version@v0.1.0
        with:
          project_name: ${{ github.event.inputs.project_name }}
          version: ${{ github.event.inputs.version }}
          changelog: ${{ github.event.inputs.changelog }}
          asset_source: ${{ github.event.inputs.asset_source }}
          asset_binary: ${{ github.event.inputs.asset_binary }}
          repo_tag_github: ${{ github.event.inputs.repo_tag_github }}
          repo_tag_gitea: ${{ github.event.inputs.repo_tag_gitea }}
          license: ${{ github.event.inputs.license }}
          registry_repo: ${{ github.event.repository.name }}
          registry_owner: ${{ github.event.repository.owner.login }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
