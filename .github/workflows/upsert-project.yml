name: Upsert Project

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Project slug (lowercase, hyphens allowed)'
        required: true
      display_name:
        description: 'Display name (auto-generated on create if blank)'
        required: false
        default: ''
      description:
        description: 'Project description'
        required: false
        default: ''
      repo_github:
        description: 'GitHub repository URL'
        required: false
        default: ''
      repo_gitea:
        description: 'Gitea repository URL'
        required: false
        default: ''
      tags:
        description: 'Comma-separated tags'
        required: false
        default: ''
      license:
        description: 'License identifier (defaults to MIT on create)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  upsert-project:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert Project
        uses: ddproxy/registry-actions/actions/upsert-project@v0.1.0
        with:
          project_name: ${{ github.event.inputs.project_name }}
          display_name: ${{ github.event.inputs.display_name }}
          description: ${{ github.event.inputs.description }}
          repo_github: ${{ github.event.inputs.repo_github }}
          repo_gitea: ${{ github.event.inputs.repo_gitea }}
          tags: ${{ github.event.inputs.tags }}
          license: ${{ github.event.inputs.license }}
          registry_repo: ${{ github.event.repository.name }}
          registry_owner: ${{ github.event.repository.owner.login }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
